[project]
name = "harm-detection-lab"
version = "1.0.0"
description = "Social Media Harm Detection Lab: Trust & Safety detection, evaluation and experimentation platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "streamlit>=1.40",
    "httpx>=0.27",
    "pydantic>=2.8",
    "pandas>=2.2",
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "plotly>=5.24",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "openai>=1.60",
    "pyarrow>=17.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "respx>=0.21",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/harm_detection"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = [
    "live: requires real provider credentials and makes paid API calls (deselected by default)",
]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Nested Streamlit widget conditionals read more clearly than combined boolean chains.
"app/pages/*.py" = ["SIM102"]
